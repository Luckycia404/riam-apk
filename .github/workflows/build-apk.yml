name: Build Queen Riam Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK, NDK 26.1 & CMake 3.22.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.1.10909125" >/dev/null

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Normalize Project Structure & Unpack Bot Engine Bundle
        run: |
          if [ -d "Queen-Riam-Server" ]; then
            cp -rf Queen-Riam-Server/* . 2>/dev/null || true
            cp -rf Queen-Riam-Server/.github . 2>/dev/null || true
          fi
          if [ ! -d "android" ] && [ -d "android-project/android" ]; then
            cp -r android-project/android ./android
          fi
          if [ -f "bot-engine/unpack-bundle.js" ]; then
            node bot-engine/unpack-bundle.js
          fi

      - name: Download Prebuilt libnode.so (nodejs-mobile ARM64 & x86_64)
        run: |
          mkdir -p /tmp/nodejs-mobile
          curl -fsSL -o /tmp/nodejs-mobile/nodejs-mobile.zip \
            "https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip"
          unzip -q -o /tmp/nodejs-mobile/nodejs-mobile.zip -d /tmp/nodejs-mobile
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp /tmp/nodejs-mobile/bin/arm64-v8a/libnode.so android/app/src/main/jniLibs/arm64-v8a/libnode.so
          cp /tmp/nodejs-mobile/bin/x86_64/libnode.so android/app/src/main/jniLibs/x86_64/libnode.so

      - name: Build Web Dashboard UI & Install Bot Engine Dependencies
        run: |
          npm install --legacy-peer-deps
          npm run build
          cd bot-engine
          npm install --omit=dev --ignore-scripts --legacy-peer-deps

      - name: Bundle Bot Engine + UI + Server into Android APK Assets (assets/nodejs-project)
        run: |
          ASSETS_DIR="android/app/src/main/assets/nodejs-project"
          rm -rf "$ASSETS_DIR"
          mkdir -p "$ASSETS_DIR"
          cp -r bot-engine/* "$ASSETS_DIR/"
          rm -f "$ASSETS_DIR/engine-bundle.json"
          rm -rf "$ASSETS_DIR/session" "$ASSETS_DIR/tmp" "$ASSETS_DIR/temp"
          rm -rf "$ASSETS_DIR/node_modules/.bin" "$ASSETS_DIR/node_modules/.cache"
          find "$ASSETS_DIR" -type l -delete
          find "$ASSETS_DIR/node_modules" \( -name "*.d.ts" -o -name "*.md" -o -name "*.map" \) -delete 2>/dev/null || true
          mkdir -p "$ASSETS_DIR/session" "$ASSETS_DIR/data" "$ASSETS_DIR/dist"
          cp -r dist/* "$ASSETS_DIR/dist/"

      - name: Compile Android APK with Gradle
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled Queen Riam APK
        uses: actions/upload-artifact@v4
        with:
          name: Queen-Riam-Android-Server-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
